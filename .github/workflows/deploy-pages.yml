name: Deploy SUPERRISSA to GitHub Pages

on:
  push:
    branches: ["main", "vibe/pixel-fury-a55549"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # il repository e' pubblico: se nel codice c'e' un segreto o un file sensibile non si pubblica nulla
      - name: Check for secrets
        run: python3 -B tools/check_secrets.py --tutti

      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # si pubblica solo cio' che il gioco carica: index.html e gli asset (WebP, sfondi JPEG, librerie,
      # font, licenze), senza sorgenti, PNG di lavoro, documenti e strumenti del repository
      - name: Prepare game files only
        run: |
          mkdir -p _site
          cp index.html _site/
          find assets -path '*/sorgenti' -prune -o -type f \( -name '*.webp' -o -name '*.jpeg' -o -name '*.mjs' -o -name '*.woff2' -o -name 'LICENSES.txt' \) -print |
            while read -r f; do mkdir -p "_site/$(dirname "$f")"; cp "$f" "_site/$f"; done
          echo "file pubblicati: $(find _site -type f | wc -l)"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
